name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -q test
      - run: ./mvnw -q -DskipTests package
      - name: Docker image
        run: docker build -t mvp-propostas-api:ci .
