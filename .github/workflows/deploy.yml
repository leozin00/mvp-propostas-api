name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment (staging ou production)
        type: choice
        options: [staging, production]
        default: staging

jobs:
  deploy:
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -q -DskipTests package
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/mvp-propostas/api:${{ github.sha }}"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --port=8080
            --allow-unauthenticated
            --update-env-vars=SPRING_PROFILES_ACTIVE=${{ vars.SPRING_PROFILE }}
      - name: Health check
        run: |
          URL="${{ vars.API_PUBLIC_URL }}/api/v1/health"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL"; then
              exit 0
            fi
            sleep 10
          done
          echo "Health check falhou: $URL"
          exit 1
