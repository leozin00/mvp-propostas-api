spring:
  datasource:
    url: jdbc:h2:mem:mvp_propostas;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

  h2:
    console:
      enabled: false

app:
  cors:
    allowed-origins: http://localhost:4200,http://127.0.0.1:4200,http://localhost:4300,http://127.0.0.1:4300,http://localhost:4400,http://127.0.0.1:4400
  admin:
    emails: admin@test.com
  firebase:
    project-id: test-project
  auth:
    require-email-verified: false
  keep-demo-seed: true
  rate-limit:
    public-per-minute: 1000
  debug:
    sentry-test-enabled: false
    mercadopago-oauth-enabled: false
  mercadopago:
    access-token: test-access-token
    sandbox-access-token: ""
    application-id: ""
    client-secret: ""
    oauth-redirect-uri: http://localhost:8080/api/v1/dev/mercadopago/oauth/callback
    webhook-secret: ""
    pro-plan-id: ""
    back-url: https://www.mercadopago.com.br
    test-payer-email: ""
    test-payer-user-id: ""
    api-base-url: https://api.mercadopago.com

sentry:
  dsn: ""
