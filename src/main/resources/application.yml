spring:
  application:
    name: mvp-propostas-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mvp_propostas}
    username: ${DB_USERNAME:mvp}
    password: ${DB_PASSWORD:mvp}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  demo:
    user-id: 11111111-1111-1111-1111-111111111111

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
