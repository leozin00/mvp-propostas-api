spring:
  application:
    name: mvp-propostas-api
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mvp_propostas}
    username: ${DB_USERNAME:mvp}
    password: ${DB_PASSWORD:mvp}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4400,http://127.0.0.1:4400}
  admin:
    emails: ${ADMIN_EMAILS:}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:gestao-propostas-mvp}
  debug:
    sentry-test-enabled: ${APP_DEBUG_SENTRY_TEST_ENABLED:true}
  mercadopago:
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    sandbox-access-token: ${MERCADOPAGO_SANDBOX_ACCESS_TOKEN:}
    application-id: ${MERCADOPAGO_APPLICATION_ID:}
    client-secret: ${MERCADOPAGO_CLIENT_SECRET:}
    oauth-redirect-uri: ${MERCADOPAGO_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/dev/mercadopago/oauth/callback}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    pro-plan-id: ${MERCADOPAGO_PRO_PLAN_ID:}
    back-url: ${MERCADOPAGO_BACK_URL:https://www.mercadopago.com.br}
    test-payer-email: ${MERCADOPAGO_TEST_PAYER_EMAIL:}
    test-payer-user-id: ${MERCADOPAGO_TEST_PAYER_USER_ID:}
    api-base-url: ${MERCADOPAGO_API_BASE_URL:https://api.mercadopago.com}

sentry:
  dsn: ${SENTRY_DSN:https://419cfa37be287d043be5e6014e36a626@o4504449191313408.ingest.us.sentry.io/4511957041414144}
  environment: ${SENTRY_ENVIRONMENT:development}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:1.0}
  send-default-pii: false
  logging:
    enabled: true
    minimum-event-level: error
    minimum-breadcrumb-level: info
  exception-resolver-enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
