spring:
  application:
    name: mvp-propostas-api
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mvp_propostas}
    username: ${DB_USERNAME:mvp}
    password: ${DB_PASSWORD:mvp}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  demo:
    user-id: 11111111-1111-1111-1111-111111111111
  debug:
    sentry-test-enabled: ${APP_DEBUG_SENTRY_TEST_ENABLED:true}

sentry:
  dsn: ${SENTRY_DSN:https://419cfa37be287d043be5e6014e36a626@o4504449191313408.ingest.us.sentry.io/4511957041414144}
  environment: ${SENTRY_ENVIRONMENT:development}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:1.0}
  send-default-pii: false
  logging:
    enabled: true
    minimum-event-level: error
    minimum-breadcrumb-level: info
  exception-resolver-enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
