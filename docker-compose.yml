services:
  postgres:
    image: postgres:16-alpine
    container_name: mvp-propostas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mvp_propostas
      POSTGRES_USER: mvp
      POSTGRES_PASSWORD: mvp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvp -d mvp_propostas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
